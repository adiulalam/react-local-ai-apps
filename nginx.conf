server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Support Single Page Application (SPA) routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets with aggressive caching
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/wasm image/svg+xml;
  gzip_disable "MSIE [1-6]\.";
}
